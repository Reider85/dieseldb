name: Auto-labeler
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Welcome new contributors
        if: github.event.action == 'opened' && contains(github.event.pull_request.user.login, '[bot]') == false
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '👋 Welcome to DieselDB! Thanks for your contribution.\n\n📋 **Quick checklist:**\n- [ ] Ensure your PR description clearly explains the changes\n- [ ] Run the relevant test gates (`make test`, etc.)\n- [ ] Update documentation if needed\n- [ ] Check out our [Contributing Guide](https://github.com/Reider85/dieseldb/blob/main/CONTRIBUTING.md)\n\n🎯 **Looking for good first issues?** Check out our [Good First Issues](https://github.com/Reider85/dieseldb/issues?q=is%3Aopen+is%3Aissue+label%3A%22good+first+issue%22)\n\n💡 **Need help?** Join our [Discussions](https://github.com/Reider85/dieseldb/discussions) or ask in the PR comments.'
            })

      - name: Check for good-first-issue label
        if: contains(github.event.pull_request.labels.*.name, 'good first issue')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🌟 **Great! This is marked as a "Good First Issue"**\n\n📚 **Resources for contributors:**\n- 📖 [Contributing Guide](https://github.com/Reider85/dieseldb/blob/main/CONTRIBUTING.md)\n- 🎯 [Good First Issues](https://github.com/Reider85/dieseldb/issues?q=is%3Aopen+is%3Aissue+label%3A%22good+first+issue%22)\n- 💬 [Discussions](https://github.com/Reider85/dieseldb/discussions)\n\n💡 **Tips for success:**\n1. Start by reading the [CONTRIBUTING.md](https://github.com/Reider85/dieseldb/blob/main/CONTRIBUTING.md)\n2. Run `make compile` and `make test` to set up your environment\n3. Ask questions in the PR comments if you need help\n4. Don\'t hesitate to reach out if you get stuck\n\nHappy coding! 🚀'
            })