name: Hybrid CI/CD
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'diesel/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'diesel/**'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'CI mode (github/local)'
        type: choice
        options: [github, local, auto]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────── Check GitHub runner limits ────────
  check-limits:
    name: Check Runner Limits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      use_local: ${{ steps.check.outputs.use_local }}
      usage_percentage: ${{ steps.check.outputs.usage_percentage }}
    
    steps:
      - name: Set CI mode
        id: check
        run: |
          # Determine mode based on input
          if [ "${{ github.event.inputs.mode }}" = "local" ]; then
            echo "use_local=true" >> $GITHUB_OUTPUT
            echo "Mode: Manual override to local"
          elif [ "${{ github.event.inputs.mode }}" = "github" ]; then
            echo "use_local=false" >> $GITHUB_OUTPUT
            echo "Mode: Manual override to GitHub"
          else
            echo "use_local=false" >> $GITHUB_OUTPUT
            echo "Mode: Auto - using GitHub Actions"
          fi

  # ──────── GitHub CI Job (Primary) ────────
  github-ci:
    name: GitHub CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check-limits
    if: needs.check-limits.outputs.use_local == 'false'
    
    env:
      MAVEN_OPTS: -Xmx2g -XX:+UseG1GC
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          build-cache: true

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-github-${{ hashFiles('pom.xml', 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-github-
            buildcache-${{ runner.os }}-

      - name: Compile (fail fast)
        run: mvn -B -T 4 --no-transfer-progress -Dstyle.color=never compile -P all -DskipTests

      - name: Run tests with coverage
        run: |
          mvn -B -T 4 --no-transfer-progress -Dstyle.color=never test -P fast,core
          mvn jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: github-ci
          name: github-ci-coverage

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: github-ci-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS - first run for this key"
          fi

  # ──────── Local CI Job (Fallback) ────────
  local-ci:
    name: Local CI (Fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-limits
    if: needs.check-limits.outputs.use_local == 'true'
    
    env:
      MAVEN_OPTS: -Xmx2g -XX:+UseG1GC
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          build-cache: true

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-local-${{ hashFiles('pom.xml', 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-local-
            buildcache-${{ runner.os }}-

      - name: Run local test runner
        run: |
          chmod +x scripts/local-test-runner.sh
          ./scripts/local-test-runner.sh fallback

      - name: Upload local test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-ci-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS - first run for this key"
          fi

  # ──────── Summary Job ────────
  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    if: always()
    needs: [check-limits, github-ci, local-ci]
    
    steps:
      - name: Generate summary
        run: |
          echo "# Hybrid CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Check Limits | ${{ needs.check-limits.result }} | Auto-detect |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub CI | ${{ needs.github-ci.result }} | ${{ needs.check-limits.outputs.use_local == 'false' && 'GitHub' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Local CI | ${{ needs.local-ci.result }} | ${{ needs.check-limits.outputs.use_local == 'true' && 'Local Fallback' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          "" >> $GITHUB_STEP_SUMMARY
          echo "## CI Mode" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ needs.check-limits.outputs.use_local == 'true' && 'Local Fallback' || 'GitHub Actions' }}" >> $GITHUB_STEP_SUMMARY
          "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test reports: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-limits.outputs.use_local }}" = "true" ]; then
            echo "- ⚠️  Running in local fallback mode due to GitHub limits" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Full GitHub CI will resume when capacity is available" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Running in normal GitHub CI mode" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Full test coverage and security scanning active" >> $GITHUB_STEP_SUMMARY
          fi