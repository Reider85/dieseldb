name: Auto Update Changelog

# Auto-update Changelog.md when a GitHub Release is published
# Triggered by GitHub Release events OR manually via workflow_dispatch
#
# Design (CI7):
# - Triggered automatically when ANY release is published (from our new release workflow)
# - Can also be triggered manually with specific tag input
# - Parses commits since last tag using conventional commits format
# - Adds new section to Changelog.md and commits back to main
# - Uses [skip ci] to avoid recursive CI loops
# - Handles version format: v3.4.73-abc1234-build.840

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to generate changelog for (e.g. v3.4.73-abc1234-build.840). Empty = latest release.'
        required: false

jobs:
  update-changelog:
    name: update-changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'published'
    permissions:
      contents: write   # required to commit back to main
    
    steps:
      # Checkout the repository with full history
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Set up JDK (needed for git operations)
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Get the release tag from GitHub releases or manual input
      - name: Get release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "No published release found — nothing to changelog."
            exit 0
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%-build.*}"
          BASE_VERSION="${BASE_VERSION%-manual.*}"
          BASE_VERSION="${BASE_VERSION%-*}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (base $BASE_VERSION)"

      # Generate changelog since last tag
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          # Find commits since last tag (excluding this release)
          # The action automatically finds the previous tag
          config: |
            release-branch-pattern: main
            # Handle our version format
            version-template: |
              ## [${version}] — ${date}
              
            categories:
              - title: "Features"
                labels: 
                  - "feat"
                # exclude_labels:
                #   - "internal"
              - title: "Performance"
                labels: 
                  - "perf"
              - title: "Bug Fixes"
                labels: 
                  - "fix"
              - title: "Documentation"
                labels: 
                  - "docs"
              - title: "Refactoring"
                labels: 
                  - "refactor"
              - title: "Chores"
                labels: 
                  - "chore"
                exclude_labels:
                  - "internal"
          # Output to a file
          output-file: changelog-entry.txt
        env:
          # GitHub token for accessing commit history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create changelog entry with proper formatting
      - name: Format changelog entry
        run: |
          # Read the generated changelog
          if [ -f "changelog-entry.txt" ]; then
            ENTRY=$(cat changelog-entry.txt)
            # Skip if empty
            if [ -z "$ENTRY" ]; then
              echo "No changelog content generated"
              exit 0
            fi
            
            # Create the new changelog section
            BASE_VERSION="${{ steps.get-tag.outputs.base_version }}"
            DATE=$(date '+%Y-%m-%d')
            
            # Format: ## [v3.4.73-abc1234-build.840] — 2026-11-19
            echo "## [${{ steps.get-tag.outputs.version }}] — ${DATE}" > new-changelog-section.txt
            echo "" >> new-changelog-section.txt
            echo "$ENTRY" >> new-changelog-section.txt
            echo "" >> new-changelog-section.txt
            
            # Show what we're about to add
            echo "=== New changelog section ==="
            cat new-changelog-section.txt
            echo "============================"
            
          else
            echo "ERROR: changelog-entry.txt not found"
            exit 1
          fi

      # Update Changelog.md with new section
      - name: Update Changelog.md
        run: |
          # Create backup of current changelog
          cp Changelog.md Changelog.md.backup
          
          # Create new changelog: new section + old changelog
          cat new-changelog-section.txt Changelog.md > Changelog.new.md
          
          # Replace the original
          mv Changelog.new.md Changelog.md
          
          echo "Changelog.md updated successfully"

      # Commit the changelog update
      - name: Commit changelog update
        run: |
          # Configure git
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit - changelog already up to date"
            exit 0
          fi
          
          # Add and commit
          git add Changelog.md
          git commit -m "docs: update changelog for ${{ steps.get-tag.outputs.version }} [skip ci]"
          
          # Push back to main
          git push origin main
          
          echo "Changelog update committed and pushed successfully"

      # Show final changelog for verification
      - name: Show final changelog
        run: |
          echo "=== Final Changelog.md (first 50 lines) ==="
          head -n 50 Changelog.md
          echo "============================================="