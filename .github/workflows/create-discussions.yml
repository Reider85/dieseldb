name: Create Welcome Discussion

on:
  workflow_dispatch:
    inputs:
      discussion_type:
        description: 'Type of discussion to create'
        type: choice
        options: ['welcome', 'roadmap', 'use_cases']
        required: true

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Create Welcome Discussion
        if: ${{ github.event.inputs.discussion_type == 'welcome' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Welcome to DieselDB Discussions"
          body-filepath: .github/discussions/welcome.md
          labels: "welcome,announcement"
          
      - name: Create Roadmap Discussion
        if: ${{ github.event.inputs.discussion_type == 'roadmap' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Roadmap v3.5 / v4.0 — what's planned"
          body-filepath: .github/discussions/roadmap.md
          labels: "roadmap,planning"
          
      - name: Create Use Cases Discussion
        if: ${{ github.event.inputs.discussion_type == 'use_cases' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Use cases — share yours!"
          body-filepath: .github/discussions/use-cases.md
          labels: "use-cases,community"

      