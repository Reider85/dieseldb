name: Security Scanning
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'diesel/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'diesel/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        language: [java]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build with Maven
        run: |
          mvn -B --no-transfer-progress -Dstyle.color=never compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "language"
          language: ${{ matrix.language }}
          auto-build: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Restore dependency-check NVD data cache
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dc-data-${{ github.run_id }}
          restore-keys: |
            dc-data-

      - name: Run dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # OWASP dependency-check via the Maven plugin: scans the real
          # dependency tree from pom.xml (the old CLI `--scan ./diesel`
          # found zero jars) and pulls NVD data through the NVD API 2.0
          # (the legacy JSON/XML feeds used by 8.2.1 are gone).
          # Pinned to 12.2.2: 13.0.0 ships `nvd.api.key=` (empty) in its
          # bundled properties, which is passed to the client as a
          # zero-length key and aborts every keyless run
          # (dependency-check/DependencyCheck#8715, fixed on main only).
          set -euo pipefail
          ARGS=(
            -DdataDirectory="$HOME/.dependency-check-data"
            -Dformat=HTML,JSON
            -DfailBuildOnCVSS=11
          )
          if [ -n "${NVD_API_KEY:-}" ]; then
            ARGS+=(-DnvdApiKeyEnvironmentVariable=NVD_API_KEY)
          else
            # An empty NVD_API_KEY (secret not configured yet) must not be
            # visible to the NVD client - drop it so the unauthenticated
            # (rate-limited) path is used instead.
            unset NVD_API_KEY
          fi
          mvn -B --no-transfer-progress -Dstyle.color=never \
            org.owasp:dependency-check-maven:12.2.2:check "${ARGS[@]}"

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            target/dependency-check-report.json
            target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 30

  vulnerability-alert:
    name: Vulnerability Alert
    runs-on: ubuntu-24.04
    if: always()
    needs: [security-scan, dependency-scan]
    permissions:
      issues: write
    
    steps:
      - name: Download dependency scan results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dependency-scan-results
          path: .

      - name: Check for vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check if any high/critical vulnerabilities were found
          if [ -f "dependency-check-report.json" ]; then
            HIGH_COUNT=$(jq '[.dependencies[]? | .vulnerabilities[]? | select((.severity // "" | ascii_upcase) as $s | $s == "HIGH" or $s == "CRITICAL")] | length' dependency-check-report.json || echo "0")
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "⚠️  Found $HIGH_COUNT high/critical vulnerabilities"
              OPEN_ALERTS=$(gh issue list --state open --search 'Security Vulnerability Alert in:title' --json number --jq 'length' 2>/dev/null || echo "0")
              if [ "$OPEN_ALERTS" -gt 0 ]; then
                echo "An open vulnerability alert issue already exists - skipping creation"
                exit 0
              fi
              echo "Creating GitHub issue..."
              
              # Create issue body
              printf "## Security Vulnerability Alert\n\nThe dependency scan detected **$HIGH_COUNT** high or critical vulnerabilities that require attention.\n\n### Next Steps\n1. Review the detailed scan results in the artifacts\n2. Update dependencies to resolve vulnerabilities\n3. Re-run the security scan after fixes\n\n### Artifacts\n- [Dependency Check Report](dependency-check-report.html)\n- [CodeQL Analysis Results](codeql-repos/*/codeql-analysis*.sarif)\n\n### Automatic Detection\nThis issue was automatically created by GitHub Actions when high/critical vulnerabilities were detected.\n" > vulnerability-issue.md

              # Create issue
              gh issue create \
                --title "Security Vulnerability Alert - $HIGH_COUNT High/Critical Issues" \
                --body-file vulnerability-issue.md \
                --label "security,vulnerability,automated"
            else
              echo "✅ No high/critical vulnerabilities detected"
            fi
          else
            echo "No dependency-check report found (dependency-scan produced no artifact)"
          fi