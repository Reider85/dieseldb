name: Release on Push

# Auto-release after every SUCCESSFUL CI run on main (GITHUB.md prompt 2).
#
# Triggered via workflow_run on CI, NOT via push: a release is created
# only after compile-gate + fast are green for that commit.
# Doc-only pushes never reach here: ci.yml skips **/*.md / docs/** / LICENSE
# / NOTICE -> no CI run -> no workflow_run event -> no release.
# pom.xml is NOT modified and nothing is pushed back to main, so this
# workflow cannot trigger CI recursively and needs no [skip ci] tag.
# Tag: v{pom-version}-build.{ci-run-number}, e.g. v3.4.18-build.762.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to release (defaults to latest main)'
        required: false
      version_override:
        description: 'Override version suffix (e.g. manual.1). Empty = auto from pom.xml + run number'
        required: false
      dry_run:
        description: 'Dry run (build + log, no tag push, no release)'
        type: boolean
        default: false

# Serialize release jobs (never cancel one in-flight: a cancelled job
# means a missed release).
concurrency:
  group: release-on-push
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Allow manual dispatch OR successful CI-triggered releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write   # required to push tags and create releases
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r' | awk 'NF{p=$0} END{print p}')
          case "$BASE" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: bad project.version '$BASE'"; exit 1 ;;
          esac
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${BASE}-${{ github.event.inputs.version_override }}"
          else
            RUN="${{ github.event.workflow_run.run_number || github.run_number }}"
            printf '%s' "$RUN" | grep -Eq '^[0-9]+$' || { echo "ERROR: run_number not numeric: '$RUN'"; exit 1; }
            VERSION="${BASE}-build.${RUN}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION} (base $BASE${{ github.event.inputs.version_override != '' && ', override: ' + github.event.inputs.version_override || ', CI run #' + (github.event.workflow_run.run_number || github.run_number) }})"

      - name: Skip if tag already exists (idempotent rerun)
        id: guard
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists - skipping (rerun/duplicate)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build JAR
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: mvn -B package -Dmaven.test.skip=true -T 4 --no-transfer-progress 2>&1 | tee build.log

      - name: Verify JAR exists
        if: steps.guard.outputs.exists == 'false'
        run: |
          ls -la target/*.jar
          test -n "$(ls target/*.jar 2>/dev/null)" || { echo "No JAR produced"; exit 1; }

      - name: Print build failure diagnosis (last 50 lines)
        if: failure()
        run: |
          echo "==== last 50 lines of Maven log ===="
          tail -n 50 build.log || true
          echo "==== errors ===="
          grep -E 'ERROR|BUILD FAILURE' build.log | head -n 30 || true

      - name: Create and push tag
        if: success() && steps.guard.outputs.exists == 'false' && github.event.inputs.dry_run != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Generate javadoc link
        id: javadoc-link
        if: steps.guard.outputs.exists == 'false'
        run: |
          # Strip leading "v" from the tag to get the version directory on Pages.
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION="${VERSION#v}"
          JAVADOC_URL="https://reider85.github.io/dieseldb/${VERSION}/"
          echo "javadoc_url=$JAVADOC_URL" >> "$GITHUB_OUTPUT"
          echo "Javadoc URL: $JAVADOC_URL"

      - name: Create GitHub Release with JAR
        if: steps.guard.outputs.exists == 'false' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ## DieselDB ${{ steps.version.outputs.tag }}

            First automated release from CI4 pipeline.

            - Built from commit ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
            - CI run: ${{ github.event.workflow_run.run_number || 'manual' }}
            - Javadoc: ${{ steps.javadoc-link.outputs.javadoc_url }}

            ⭐ Star this repo if you find DieselDB useful.

      - name: Release summary
        if: success()
        run: |
          echo "## Release published" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- JAR: $(ls target/*.jar)" >> $GITHUB_STEP_SUMMARY
          echo "- Javadoc: ${{ steps.javadoc-link.outputs.javadoc_url }}" >> $GITHUB_STEP_SUMMARY
