name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Java 17 - быстрые тесты
  java17-quick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      
      - name: Build and Test (Java 17 Quick)
        run: mvn -B clean verify -P java17-quick
      
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java17-quick
          path: target/surefire-reports/
          retention-days: 7

  # Java 17 - все тесты
  java17-all:
    runs-on: ubuntu-latest
    steps:
