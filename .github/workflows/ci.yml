name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (only used for manual trigger; nightly uses matrix)'
        type: choice
        options: [fast, core, concurrency, network, perf, large, all]
        required: false
        default: fast

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.profile || github.event_name }}
  cancel-in-progress: true

jobs:
  # ──────── TIA: run only impacted profiles on PR ────────
  pr-gate-tia:
    name: tia-impact
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: needed for git diff vs base branch

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect impacted profiles
        id: tia
        run: |
          PROFILES=$(./scripts/tia.sh --profiles "origin/${{ github.base_ref }}...HEAD")
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          echo "Impacted profiles: $PROFILES"

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run impacted profiles
        if: steps.tia.outputs.profiles != ''
        run: |
          for p in ${{ steps.tia.outputs.profiles }}; do
            echo "--- $p ---"
            mvn -B test -P "$p" || exit 1
          done

      - name: Nothing to run
        if: steps.tia.outputs.profiles == ''
        run: echo "No impacted test buckets - skipping test run"

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload TIA test reports
        if: always() && steps.tia.outputs.profiles != ''
        uses: actions/upload-artifact@v4
        with:
          name: reports-tia
          path: target/surefire-reports/
          retention-days: 7

  pr-gate:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        profile: [fast, core, concurrency, network]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Build and run tests
        run: mvn -B test -P ${{ matrix.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.profile }}
          path: target/surefire-reports/
          retention-days: 7

  nightly:
    name: nightly-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        profile: [perf, large]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run ${{ matrix.profile }} tests
        run: mvn -B test -P ${{ matrix.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload performance history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.profile }}-artifacts
          path: |
            analytics/performance_history.csv
            analytics/regression_baseline.md
            analytics/benchmark_report.md
            target/surefire-reports/
          retention-days: 30

  manual:
    name: manual-${{ inputs.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run ${{ inputs.profile }} profile
        run: mvn -B test -P ${{ inputs.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-${{ inputs.profile }}-reports
          path: target/surefire-reports/

  release-gate:
    name: all-tests
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run ALL tests
        run: mvn -B clean verify -P all

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: target/*.jar
          retention-days: 30
