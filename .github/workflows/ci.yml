name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (only used for manual trigger; nightly uses matrix)'
        type: choice
        options: [fast, core, concurrency, network, perf, large, all]
        required: false
        default: fast

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.profile || github.event_name }}
  cancel-in-progress: true

jobs:
  # ──────── TIA: run only impacted profiles on PR ────────
  pr-gate-tia:
    name: tia-impact
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: needed for git diff vs base branch

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect impacted profiles
        id: tia
        run: |
          PROFILES=$(./scripts/tia.sh --profiles "origin/${{ github.base_ref }}...HEAD")
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          echo "Impacted profiles: $PROFILES"

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run impacted profiles
        if: steps.tia.outputs.profiles != ''
        run: |
          for p in ${{ steps.tia.outputs.profiles }}; do
            echo "--- $p ---"
            mvn -B test -P "$p" || exit 1
          done

      - name: Nothing to run
        if: steps.tia.outputs.profiles == ''
        run: echo "No impacted test buckets - skipping test run"

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload TIA test reports
        if: always() && steps.tia.outputs.profiles != ''
        uses: actions/upload-artifact@v4
        with:
          name: reports-tia
          path: target/surefire-reports/
          retention-days: 7

  # TESTS-10: fail fast when a new diesel/*.java source has no line in
  # scripts/tia-mapping.txt - TIA would otherwise report "no tests to run"
  # for that file and PRs/pushes would merge without verification.
  lint-tia-mapping:
    name: tia-mapping-drift
    runs-on: ubuntu-24.04
    # DEVIATION from prompt TESTS-10 (user-approved): the prompt gated this on
    # pull_request only, but this repo releases by pushing straight to main -
    # a PR-only guard would never fire. push covers the real workflow.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Verify tia-mapping.txt covers all diesel sources
        run: ./scripts/check-tia-mapping.sh

  pr-gate:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        profile: [fast, core, concurrency, network]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Build and run tests
        run: mvn -B test -P ${{ matrix.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.profile }}
          path: target/surefire-reports/
          retention-days: 7

  nightly:
    name: nightly-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        profile: [perf, large]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run ${{ matrix.profile }} tests
        run: mvn -B test -P ${{ matrix.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload performance history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.profile }}-artifacts
          path: |
            analytics/performance_history.csv
            analytics/regression_baseline.md
            analytics/benchmark_report.md
            target/surefire-reports/
          retention-days: 30

  nightly-flaky:
    name: nightly-flaky
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache-flaky
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-flaky-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-flaky-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      # TESTS-5: four invocations, together all 5 quarantined @Tag("flaky") tests,
      # ordered so the load-sensitive assertions run first on a settled runner
      # (NO clean: a full recompile right before the p99 test measured 42ms).
      # Step 1 gets ONE isolated retry (AGENTS.md Known-Flakes protocol); steps
      # 2-4 use if:always() so a red flake never hides the other results.
      # Red = the signal that a quarantined flake got worse; gates stay green.
      - name: Run quarantined WAL group-commit acceptance (idle runner)
        run: |
          if ! mvn -B test -P flaky -Dtest=GroupCommitThroughputTest; then
            echo "1/4 red - one isolated retry after 10s cooldown (Known-Flakes protocol)"
            sleep 10
            mvn -B test -P flaky -Dtest=GroupCommitThroughputTest
          fi

      - name: Run quarantined JSONL 1M benchmark
        if: always()
        run: mvn -B test -P flaky-jsonl

      - name: Run quarantined FlusherTest (slow)
        if: always()
        run: mvn -B test -P flaky -Dtest=FlusherTest

      - name: Run quarantined WALReadAll readAll-vs-sort microbenchmark
        if: always()
        run: mvn -B test -P flaky -Dtest=WALReadAllIsAlreadySortedTest

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache-flaky.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload flaky test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-flaky-reports
          path: target/surefire-reports/
          retention-days: 30

  # TESTS-8: the network/concurrency profiles run all classes in ONE reused
  # JVM (reuseForks=true) - a leaked server socket, unstopped daemon or
  # JVM-global mutation in any class can only show up as an order-dependent
  # flake across repeated runs. Run each profile 3x on a schedule to catch
  # such regressions; a red here is the signal (add @Isolated to the
  # offending class), gates stay green. No clean per TESTS-1 policy.
  profile-stability:
    name: stability-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        profile: [network, concurrency]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache-stability
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-stability-${{ matrix.profile }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-stability-${{ matrix.profile }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run ${{ matrix.profile }} 3x (stability)
        run: |
          for i in 1 2 3; do
            echo "--- ${{ matrix.profile }} run $i ---"
            mvn -B test -P ${{ matrix.profile }} || exit 1
          done

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache-stability.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS - first run for this key"
          fi

      - name: Upload stability test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-${{ matrix.profile }}-reports
          path: target/surefire-reports/
          retention-days: 30

  manual:
    name: manual-${{ inputs.profile }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect orphaned test classes
        run: |
          src_count=$(git ls-files 'src/test/java/**/*.java' | wc -l)
          cls_count=$(find target/test-classes -name '*.class' 2>/dev/null | wc -l)
          if [ "$cls_count" -gt "$src_count" ]; then
            echo "ERROR: orphaned test .class files (deleted .java left .class behind)"; exit 1
          fi
          echo "No orphaned .class files found."

      - name: Run ${{ inputs.profile }} profile
        run: mvn -B test -P ${{ inputs.profile }}

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-${{ inputs.profile }}-reports
          path: target/surefire-reports/

  release-gate:
    name: all-tests
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven build-cache
        id: cache-buildcache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache/v1/com.dieseldb/dieseldb
          key: buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-${{ hashFiles('pom.xml', 'diesel/**/*.java', 'src/test/java/**/*.java', 'src/main/avro/**/*.avsc') }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ matrix.profile || inputs.profile || 'release' }}-
            buildcache-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run ALL tests
        run: mvn -B clean verify -P all

      - name: Cache hit summary
        if: always()
        run: |
          HIT="${{ steps.cache-buildcache.outputs.cache-hit }}"
          if [ "$HIT" = "true" ]; then
            echo "Build-cache HIT (exact key)"
          elif [ -n "$HIT" ]; then
            echo "Build-cache PARTIAL HIT (restore-keys fallback)"
          else
            echo "Build-cache MISS — first run for this key"
          fi

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: target/*.jar
          retention-days: 30
