# Labeler configuration for DieselDB
# This configuration automatically applies labels to pull requests based on file paths

# Label mapping for different areas of the codebase
labels:
  # Core Engine
  "storage": 
    - "src/main/java/diesel/storage/**"
    - "src/test/java/diesel/storage/**"
  "recovery":
    - "src/main/java/diesel/recovery/**"
    - "src/test/java/diesel/recovery/**"
  "transaction":
    - "src/main/java/diesel/transaction/**"
    - "src/test/java/diesel/transaction/**"
  "query":
    - "src/main/java/diesel/query/**"
    - "src/test/java/diesel/query/**"
  "planner":
    - "src/main/java/diesel/planner/**"
    - "src/test/java/diesel/planner/**"
  
  # SQL and Parser
  "sql":
    - "src/main/java/diesel/sql/**"
    - "src/test/java/diesel/sql/**"
    - "src/main/java/diesel/parser/**"
    - "src/test/java/diesel/parser/**"
  
  # Indexes
  "index":
    - "src/main/java/diesel/index/**"
    - "src/test/java/diesel/index/**"
  
  # WAL (Write-Ahead Logging)
  "wal":
    - "src/main/java/diesel/wal/**"
    - "src/test/java/diesel/wal/**"
  
  # MVCC
  "mvcc":
    - "src/main/java/diesel/mvcc/**"
    - "src/test/java/diesel/mvcc/**"
  
  # Configuration
  "config":
    - "src/main/java/diesel/config/**"
    - "src/test/java/diesel/config/**"
    - "config.properties"
    - "pom.xml"
  
  # Tests
  "test":
    - "src/test/java/**"
    - "**/*Test.java"
    - "**/*Test.java"
  
  # Documentation
  "documentation":
    - "README.md"
    - "CONTRIBUTING.md"
    - "Changelog.md"
    - "*.md"
    - "docs/**"
  
  # Build and CI
  "build":
    - "pom.xml"
    - ".github/workflows/**"
    - "scripts/**"
    - "Makefile"
    - "*.sh"
    - "*.ps1"
  
  # Drivers
  "drivers":
    - "drivers/**"
    - "**/driver*/**"

# Priority labels (applied after area labels)
priorities:
  "critical":
    - "**/LogicalDump.java"
    - "**/LogicalRestore.java"
    - "**/TablespaceRegistry.java"
    - "**/PhysicalBackup.java"
  "high":
    - "**/TupleVisibility.java"
    - "**/QueryParser.java"
    - "**/IndexManager.java"
  "medium":
    - "**/*.java"

# Type labels
types:
  "bug":
    - "**/*Exception.java"
    - "**/*Error.java"
    - "**/fix*/**"
  "feature":
    - "**/add*/**"
    - "**/new*/**"
    - "**/create*/**"
  "documentation":
    - "**/doc*/**"
    - "**/README**"
  "refactor":
    - "**/refactor*/**"
    - "**/cleanup*/**"
    - "**/optimize*/**"
  "test":
    - "**/test*/**"
    - "**/*Test.java"