name: Issue Template Configuration
description: Configuration for issue templates
body:
  - type: markdown
    attributes:
      value: |
        # Welcome to DieselDB Issue Templates!

        This repository uses structured issue templates to help us get better bug reports and feature requests.

        ## Quick Links

        - **🐛 Bug Reports**: Use our [Bug Report template](https://github.com/Reider85/dieseldb/issues/new?template=bug_report.yml)
        - **💡 Feature Requests**: Use our [Feature Request template](https://github.com/Reider85/dieseldb/issues/new?template=feature_request.yml)
        - **❓ Questions**: Use our [Question template](https://github.com/Reider85/dieseldb/issues/new?template=question.yml)

        ## Getting Help

        For general questions and discussions, consider using our [Discussions](https://github.com/Reider85/dieseldb/discussions) instead of creating issues.

        ## Good First Issues

        Looking to contribute? Check out our [Good First Issues](https://github.com/Reider85/dieseldb/issues?q=is%3Aopen+is%3Aissue+label%3A%22good+first+issue%22) for beginner-friendly tasks.

        ## Contributing

        Want to contribute code? See our [Contributing Guide](https://github.com/Reider85/dieseldb/blob/main/CONTRIBUTING.md) for detailed instructions.

        ## Reporting Security Issues

        Please do not report security issues through public GitHub issues. Contact the maintainer directly at Reider85 / Vasiliy Zhila.

        Thank you for helping us improve DieselDB! 🚀