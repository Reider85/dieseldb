name: Bug Report
description: Report a bug to help us improve DieselDB
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us understand and reproduce the issue.

  - type: input
    id: diesel-version
    attributes:
      label: DieselDB Version
      description: Version from pom.xml (e.g., 3.4.4)
      placeholder: "3.4.4"
    validations:
      required: true

  - type: input
    id: jdk-version
    attributes:
      label: JDK Version
      description: Java version (e.g., 21.0.2)
      placeholder: "21.0.2"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS name and version (e.g., Windows 11, Ubuntu 22.04)
      placeholder: "Windows 11"
    validations:
      required: true

  - type: dropdown
    id: storage-backend
    attributes:
      label: Storage Backend
      description: Which storage backend are you using?
      options:
        - CSV
        - TSV
        - JSONL
        - AVRO
        - In-memory
    validations:
      required: true

  - type: textarea
    id: sql-query
    attributes:
      label: SQL Query
      description: The exact SQL query that causes the issue
      placeholder: "SELECT * FROM users WHERE id = 1;"
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "The query should return the user with id=1"
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "The query throws NullPointerException"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue
      placeholder: |
        1. Create a database with CSV storage
        2. Insert a user record
        3. Run the SELECT query
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs
      description: Any relevant error messages or stack traces
      placeholder: "java.lang.NullPointerException: ..."
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context that might be helpful
      placeholder: "This happens only when using the CSV backend..."
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all the required information above
          required: true
        - label: I am willing to help test a fix
          required: false