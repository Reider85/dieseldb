name: Question
description: Ask a question about using DieselDB
title: "[QUESTION] "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your question about DieselDB! Please provide as much detail as possible to help us understand and assist you.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know about DieselDB?
      placeholder: I have a question about... and I need help understanding...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide context about your situation and what you're trying to achieve
      placeholder: |
        I'm building a... application and I need to...
        My current setup includes...
        I've already tried...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DieselDB Version
      description: The version of DieselDB you're using (check pom.xml)
      placeholder: "3.3.99"
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK Version
      description: The Java Development Kit version
      placeholder: "21.0.2"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Your operating system and version
      placeholder: "Ubuntu 22.04 LTS"
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage Backend
      description: Which storage backend are you using?
      options:
        - in_memory
        - csv
        - tsv
        - jsonl
        - avro
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Describe the specific scenario or use case
      placeholder: |
        I'm trying to...
        My goal is to...
        The expected behavior should be...
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: What You've Tried
      description: What steps have you already taken to solve this?
      placeholder: |
        I tried... but it didn't work because...
        I looked at... but I'm not sure how to...
        I attempted... but got stuck on...
    validations:
      required: false

  - type: textarea
    id: sql
    attributes:
      label: SQL Queries
      description: Any SQL queries related to your question
      placeholder: |
        CREATE TABLE ...;
        SELECT ...;
        INSERT ...;
    render: sql

  - type: textarea
    id: code
    attributes:
      label: Code Snippets
      description: Any Java code or configuration related to your question
      render: java
      placeholder: |
        // Java code example
        Database db = new Database(...);
        // Your code here...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Any relevant logs or error messages
      placeholder: |
        ERROR: [error message here]
        Stack trace...
    validations:
      required: false

  - type: textarea
    id: documentation
    attributes:
      label: Documentation References
      description: Have you checked specific documentation sections?
      placeholder: |
        I checked the documentation at...
        I read the section about...
        The documentation mentions... but I'm not sure how to apply it...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other context that might be helpful
      placeholder: Additional information that might help answer your question...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and discussions for similar questions
          required: true
        - label: I have read the documentation
          required: true
        - label: I'm comfortable sharing my question publicly
          required: true