name: Question
description: Ask a question about using DieselDB
title: "[QUESTION] "
labels: ["question"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your question! Please provide as much detail as possible to help us understand your needs.

        **Note:** For general usage questions, consider posting in our [Discussions](https://github.com/Reider85/dieseldb/discussions) instead. This template is for specific technical questions that might need detailed investigation.

  - type: input
    id: diesel-version
    attributes:
      label: DieselDB Version
      description: Version from pom.xml (e.g., 3.4.4)
      placeholder: "3.4.4"
    validations:
      required: true

  - type: input
    id: jdk-version
    attributes:
      label: JDK Version
      description: Java version (e.g., 21.0.2)
      placeholder: "21.0.2"
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What category does your question relate to?
      options:
        - Installation and Setup
        - Configuration
        - SQL Syntax and Queries
        - Storage Backends
        - Performance and Optimization
        - Integration with Other Tools
        - Development and Contributing
        - Other
    validations:
      required: true

  - type: textarea
    id: question-details
    attributes:
      label: Question Details
      description: Please provide a detailed description of your question
      placeholder: "I'm trying to configure DieselDB to use multiple storage backends..."
    validations:
      required: true

  - type: textarea
    id: attempted-solutions
    attributes:
      label: Attempted Solutions
      description: What have you tried so far to solve this?
      placeholder: "I've tried modifying the config.properties file..."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context that might be helpful
      placeholder: "I'm running DieselDB on Windows 11 with 16GB RAM..."
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and discussions to avoid duplicates
          required: true
        - label: I have provided a clear description of my question
          required: true
        - label: I am willing to help test a solution
          required: false