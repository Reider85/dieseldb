name: Feature Request
description: Suggest a new feature or improvement for DieselDB
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Be specific and clear.
      placeholder: "I need to be able to perform complex joins with large datasets efficiently..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: What would you like to see implemented? Describe the feature in detail.
      placeholder: "Add support for hash join algorithm to improve join performance..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered? Why is your proposed solution better?
      placeholder: "I considered using nested loops, but hash join would be more efficient for large datasets..."
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases where this feature would be valuable
      placeholder: |
        - Analytics dashboard with large joins
        - ETL processing pipelines
        - Reporting systems
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking production use)
        - High (major productivity improvement)
        - Medium (nice to have)
        - Low (future consideration)
    validations:
      required: true

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Implementation Ideas
      description: Any thoughts on how this could be implemented? (Optional)
      placeholder: "This could be implemented by modifying the join planner..."
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided a clear description of the problem and solution
          required: true
        - label: I am willing to help test this feature if implemented
          required: false