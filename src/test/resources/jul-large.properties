# TESTS-12: quiet java.util.logging config for the large / perf / timing-quick
# profiles. Activated ONLY via the java.util.logging.config.file system property
# set in those profiles' surefire <systemPropertyVariables> (pom.xml).
#
# The engine's SQL layer (QueryParser, SubqueryParser, Table, Database,
# SelectQuery, ...) logs through JUL, not slf4j, so the logback-large.xml file
# alone cannot silence it. Root .level=WARNING covers every JUL logger that does
# not set its own level.
#
# NB: diesel.QueryParser is NOT covered by this file - its static initializer
# force-sets its own logger AND its own ConsoleHandler to the value of
# logging.level.diesel (config.properties, default INFO) AFTER the LogManager
# has read this file. That is why the same profiles also pass
# -Dlogging.level.diesel=WARNING, which QueryParser's static block honors
# (system property beats config.properties).
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
