transaction.isolation.level = SERIALIZABLE
server.socket.timeout = 30000
java.util.logging.ConsoleHandler.level = FINEST
logging.level.diesel=ALL
diesel.SelectQueryParser.level = FINEST
diesel.QueryParser.level=ALL
diesel.ConditionParser.level = FINEST
max.inmemory.rows = 10000
max.hash.table.size.mb = 512
max.result.rows = 1000000
diesel.profile.slow.threshold.ms = 1000
compression.threshold.bytes = 1024
compression.level = 6
query.cache.max.size = 1000
server.pool.size = 100
server.queue.capacity = 100
server.backlog = 512
hash.join.overhead.rows = 1000
select.memory.sample.interval = 4096
bloom.filter.hashes = 7
bloom.filter.fpp = 0.01
parallel.index.scan.threshold = 10000
## TSV storage index manager (diesel.storage.TsvIndexManager)
tsv.block.size = 1000
tsv.cache.max.blocks = 64
tsv.parallel.read.threshold = 10000
## CSV storage index manager (diesel.storage.CsvIndexManager)
csv.block.size = 1000
csv.cache.max.blocks = 64
csv.parallel.read.threshold = 10000
## Storage type: in_memory | csv | tsv | jsonl | avro
storage.type = csv
## Header mismatch mode: fail | warn
storage.header.mismatch.mode = fail
## Null representation: legacy (null = empty field) | sentinel (TSV: \N, CSV: quoted "")
storage.null.representation = legacy
## Load error mode: fail | skip_row | skip_value
storage.load.error.mode = fail
## Charset used for reading/writing CSV/TSV/JSONL files (default: UTF-8)
storage.charset = UTF-8
## Character-buffer size (chars) for all buffered delimited readers/writers (default: 65536)
storage.buffer.size = 65536
## Load mode per format: file (always delimited .csv/.tsv) | auto_mtime (fresher .table via Java serialization, else delimited)
csv.load.mode = file
tsv.load.mode = file
## Mirror .table on save (Table.saveToSerializedFile() is the default .table writer; mirror is opt-in): on | off
csv.table.mirror = off
tsv.table.mirror = off
## CSV/TSV compression codec (Prompt 39): none | zstd | lz4 | snappy (code-level default: zstd)
## none keeps the exact pre-prompt-39 plain format; compressed files read transparently regardless of the setting
csv.compression.codec = none
tsv.compression.codec = none
## Compression level (ZSTD: 1..22, default 3; LZ4/Snappy have no level and ignore this)
csv.compression.level = 3
tsv.compression.level = 3
## Atomic file writer: rename retry for Windows transient file locks (attempts, max backoff per attempt)
atomic.write.move.max.attempts = 10
atomic.write.move.retry.max.delay.ms = 300
## JSONL duplicate field-name handling (prompt 43): fail (reject) | last_wins (warn, keep last)
jsonl.duplicate.keys = fail
## JSONL type-coercion mode (prompt 43): strict (reject string->number) | lenient (coerce with WARNING)
jsonl.type.coercion = strict
## JSONL schema-matching mode (prompt 44): strict (unknown field -> error + typo hint) | inferred (schema derived from data, saved to sidecar) | hybrid (keep schema, expand with new fields)
jsonl.schema.mode = hybrid
## JSONL nested-storage mode (prompt 45): flatten (nested leaves -> dot-named columns, reconstructed on save; default) | json_column (whole object/array stored as JSON text in one column, JSON Path on read)
jsonl.nested.mode = flatten
## JSONL array-storage mode (prompt 45): json (whole array in one JSON column; default) | expand (scalar arrays expand to arr[0], arr[1], ... columns; arrays of objects always keep a single JSON column)
jsonl.array.columns = json
## JSONL missing-field policy (prompt 47): null (treat as null; default) | error (fail with file:line) | default (= null, backward-compatible)
jsonl.missing.field = default
## JSONL load-error policy (prompt 48): fail (abort with file:line diagnostics; default) | skip_row (log file:line + reason as WARNING, skip the row, continue, final WARNING with the skipped count)
jsonl.load.error.mode = fail
## JSONL write-mode policy (prompt 49): rewrite (full atomic rewrite on every save; default) | append (new rows appended, deltas in .jsonl.delta sidecar)
jsonl.write.mode = rewrite
## JSONL compaction threshold (prompt 49): ratio of (deletions + new rows) / total that triggers automatic compaction (default: 0.3 = 30%)
jsonl.compaction.threshold = 0.3
## JSONL load mode (prompt 50): file (always .jsonl with consistency check) | auto_mtime (fresher .table via Java serialization, else .jsonl)
jsonl.load.mode = file
## Mirror .table on save (prompt 50): on | off (default: on; off saves ~50% I/O)
jsonl.table.mirror = off
## JSONL compression codec (Prompt 52): none | zstd | lz4 | snappy (code-level default: zstd)
## none keeps the exact pre-prompt-52 plain format; compressed files read transparently regardless of the setting
jsonl.compression.codec = none
## Compression level (ZSTD: 1..22, default 3; LZ4/Snappy have no level and ignore this)
jsonl.compression.level = 3
## JSONL parallel read (prompt 54): minimum number of data lines in a plain .jsonl file before the byte-offset parallel reader is used; below it the sequential path runs (default: 10000). Compressed JSONL is always read sequentially.
jsonl.parallel.read.threshold = 10000
## JSONL lazy block loading (prompt 55): on | off (default: off). When on, a plain .jsonl load in rewrite mode defers the full parse and serves readProjected() column subsets block-by-block from real on-disk byte ranges (bounded LRU block cache); any classic row access (scan/insert/save/...) materialises the full load transparently with identical results.
jsonl.lazy.blocks = off
## JSONL block size (prompt 55): number of data lines per lazy block (default 1000); with jsonl.block.cache.blocks this bounds the per-block pre-scan -> byte-range -> parse work.
jsonl.block.rows = 1000
## JSONL lazy block cache (prompt 55): number of full blocks kept hot in the LRU cache; a miss issues a real on-disk range read (default 16).
jsonl.block.cache.blocks = 16
## AVRO storage (Section 2, prompt 57+)
## Root directory for AVRO data files (default: data/avro)
avro.path = data/avro
## Schema source directory for .avsc files (resolved from project root)
avro.schema.path = src/main/avro
## Compression codec (prompt 62): null (no compression) | deflate | snappy | zstandard | bzip2 (default: null)
## Written into the Avro file header, so any existing/readable file keeps its own codec on load.
avro.compression.codec = null
## Compression level (prompt 62/63; default: -1 = codec default).
## deflate: -1 (JDK default) or 0..9; zstandard: -1 (Avro default 3) or 1..22; snappy/bzip2/null ignore it.
## Dedicated ZStandard codec: diesel/storage/avro/ZStandardCodec (prompt 63, zstd-jni native).
avro.compression.level = -1
## Auto-select codec by payload size (prompt 62): off | on (default: off).
## When on, datasets whose estimated uncompressed payload is below
## avro.compression.auto.min.bytes are written with the null codec.
avro.compression.auto = off
## Auto-select payload-size threshold in bytes (prompt 62; default: 1048576 = 1 MiB).
avro.compression.auto.min.bytes = 1048576
## Block size in bytes for AVRO data files (default: 67108864 = 64 MB)
avro.block.size = 67108864
## Workload preset for block size: default | streaming (128MB) | random_access (16MB) | batch (256MB)
avro.block.workload = default
## Sync marker interval in bytes (default: 67108864 = 64 MB, same as block size)
avro.block.sync.interval = 67108864
## Parallel read (prompt 63, reserved): minimum number of blocks in an AVRO data file
## before a sync-marker driven parallel read is considered instead of a streaming read
## (default: 10000). The reader and iterator built in prompt 61 provide the seek-by-sync
## and batch primitives this feature builds upon.
avro.parallel.read.threshold = 10000
## Split compatibility (prompt 70, MapReduce/Spark): target byte size of a split
## computed by AvroInputFormatCompat.computeSplits (default: 67108864 = 64 MB).
## Blocks accumulate into a split until this weight is reached.
avro.split.size = 67108864
## Minimum byte length of a trailing split before it is merged into the
## previous one (prompt 70; default: 1048576 = 1 MiB).
avro.split.min.size = 1048576
## Schema evolution (prompt 71): default compatibility mode enforced on schema
## evolution — BACKWARD | FORWARD | FULL | NONE (default: BACKWARD).
## BACKWARD: a new reader schema can read data written with the old schema.
## FORWARD: an old reader schema can read data written with the new schema.
## FULL: both directions. NONE: no constraint.
avro.schema.compatibility.mode = BACKWARD
## Schema evolution (prompt 71): history file template for SchemaEvolutionManager
## version persistence. A {table} placeholder is expanded with the sanitized table
## name; when blank the default "<table>.schema-history.json" is used.
avro.schema.evolution.history.file =
## Snappy optimization settings (prompt 64)
## Default buffer size for Snappy compression (default: 8192 = 8KB)
## Available options: 4096, 8192, 16384, 32768, 65536
avro.snappy.buffer.size = 8192
## Enable compressor/decompressor caching for Snappy (default: true)
## Caching reduces initialization overhead for small files
avro.snappy.cache.compressors = true
## Buffer sizes to benchmark for Snappy optimization (comma-separated)
## Used for performance testing and optimal buffer size detection
avro.snappy.benchmark.sizes = 4096,8192,16384,32768,65536
## Auto-optimize buffer size based on data pattern (default: true)
## When enabled, automatically selects buffer size based on data characteristics
avro.snappy.auto.optimize = true

## Deflate compression level configuration (prompt 65)
## Adaptive level selection: off | on (default: off)
## When on, level is automatically selected based on data characteristics
avro.deflate.adaptive = off
## Deflate level selection strategy: speed | balanced | ratio (default: balanced)
## Used when adaptive mode is off for recommendations
avro.deflate.strategy = balanced
## Compressor caching: off | on (default: on)
## Caches compressors to reduce initialization overhead
avro.deflate.cache.compressors = on
## Cache size limit (number of cached compressors, default: 10)
avro.deflate.cache.max.size = 10
## BZip2 compression (prompt 66): block size in bytes (100000-900000, default 900000)
## BZip2 provides best compression ratio for cold/archival data; slower write speed acceptable for infrequent access.
avro.bzip2.block.size = 900000
## Cold-data threshold in bytes (prompt 66): data larger than this is recommended for bzip2 (default 10485760 = 10 MB)
avro.bzip2.cold.threshold = 10485760
## Adaptive compression (prompt 67): enable runtime codec auto-switching (default: off)
avro.adaptive.enabled = false
## Adaptive sliding window size (prompt 67): number of recent compression events to track (default: 100)
avro.adaptive.window.size = 100
## Adaptive ratio threshold (prompt 67): min ratio difference to recommend a switch (default: 0.20)
avro.adaptive.ratio.threshold = 0.20
## Adaptive minimum samples (prompt 67): min operations before recommendations (default: 10)
avro.adaptive.min.samples = 10
