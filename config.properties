transaction.isolation.level = SERIALIZABLE
server.socket.timeout = 30000
java.util.logging.ConsoleHandler.level = FINEST
logging.level.diesel=ALL
diesel.SelectQueryParser.level = FINEST
diesel.QueryParser.level=ALL
diesel.ConditionParser.level = FINEST
max.inmemory.rows = 10000
max.hash.table.size.mb = 512
max.result.rows = 1000000
diesel.profile.slow.threshold.ms = 1000
compression.threshold.bytes = 1024
compression.level = 6
query.cache.max.size = 1000
server.pool.size = 100
server.queue.capacity = 100
hash.join.overhead.rows = 1000
select.memory.sample.interval = 4096
bloom.filter.hashes = 7
bloom.filter.fpp = 0.01
parallel.index.scan.threshold = 10000
# Prompt 88: columnar storage (Parquet) for analytical queries
columnar.enabled = true
columnar.threshold.rows = 1000000
columnar.conversion.interval.seconds = 30

# Persistent storage format selector (whole-database file read/write mechanism).
# Choices: PARQUET | CSV | SERIALIZED | AUTO
#   PARQUET   - single .parquet file per table serves both persistence and OLAP reads
#   CSV       - legacy .table (Java serialization) + .csv export (DEFAULT)
#   SERIALIZED- Java serialization only (.table)
#   AUTO      - PARQUET for tables >= columnar.threshold.rows rows, CSV otherwise
# Columnar (PARQUET) storage is opt-in: set storage.format=PARQUET to enable.
storage.format = CSV
