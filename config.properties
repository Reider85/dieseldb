transaction.isolation.level = SERIALIZABLE
server.socket.timeout = 30000
java.util.logging.ConsoleHandler.level = FINEST
logging.level.diesel=ALL
diesel.SelectQueryParser.level = FINEST
diesel.QueryParser.level=ALL
diesel.ConditionParser.level = FINEST
max.inmemory.rows = 10000
max.hash.table.size.mb = 512
max.result.rows = 1000000
diesel.profile.slow.threshold.ms = 1000
compression.threshold.bytes = 1024
compression.level = 6
query.cache.max.size = 1000
server.pool.size = 100
server.queue.capacity = 100
hash.join.overhead.rows = 1000
select.memory.sample.interval = 4096
bloom.filter.hashes = 7
bloom.filter.fpp = 0.01
parallel.index.scan.threshold = 10000
## TSV storage index manager (diesel.storage.TsvIndexManager)
tsv.block.size = 1000
tsv.cache.max.blocks = 64
tsv.parallel.read.threshold = 10000
## CSV storage index manager (diesel.storage.CsvIndexManager)
csv.block.size = 1000
csv.cache.max.blocks = 64
csv.parallel.read.threshold = 10000
## Storage type: in_memory | csv | tsv | jsonl
storage.type = csv
## Header mismatch mode: fail | warn
storage.header.mismatch.mode = fail
## Null representation: legacy (null = empty field) | sentinel (TSV: \N, CSV: quoted "")
storage.null.representation = legacy
## Load error mode: fail | skip_row | skip_value
storage.load.error.mode = fail
## Charset used for reading/writing CSV/TSV/JSONL files (default: UTF-8)
storage.charset = UTF-8
## Load mode per format: file (always delimited .csv/.tsv) | auto_mtime (fresher .table via Java serialization, else delimited)
csv.load.mode = file
tsv.load.mode = file
## Mirror .table on save (Table.saveToSerializedFile() is the default .table writer; mirror is opt-in): on | off
csv.table.mirror = off
tsv.table.mirror = off
## CSV/TSV compression codec (Prompt 39): none | zstd | lz4 | snappy (code-level default: zstd)
## none keeps the exact pre-prompt-39 plain format; compressed files read transparently regardless of the setting
csv.compression.codec = none
tsv.compression.codec = none
## Compression level (ZSTD: 1..22, default 3; LZ4/Snappy have no level and ignore this)
csv.compression.level = 3
tsv.compression.level = 3
## Atomic file writer: rename retry for Windows transient file locks (attempts, max backoff per attempt)
atomic.write.move.max.attempts = 10
atomic.write.move.retry.max.delay.ms = 300
## JSONL duplicate field-name handling (prompt 43): fail (reject) | last_wins (warn, keep last)
jsonl.duplicate.keys = fail
## JSONL type-coercion mode (prompt 43): strict (reject string->number) | lenient (coerce with WARNING)
jsonl.type.coercion = strict
## JSONL schema-matching mode (prompt 44): strict (unknown field -> error + typo hint) | inferred (schema derived from data, saved to sidecar) | hybrid (keep schema, expand with new fields)
jsonl.schema.mode = hybrid
## JSONL nested-storage mode (prompt 45): flatten (nested leaves -> dot-named columns, reconstructed on save; default) | json_column (whole object/array stored as JSON text in one column, JSON Path on read)
jsonl.nested.mode = flatten
## JSONL array-storage mode (prompt 45): json (whole array in one JSON column; default) | expand (scalar arrays expand to arr[0], arr[1], ... columns; arrays of objects always keep a single JSON column)
jsonl.array.columns = json
## JSONL missing-field policy (prompt 47): null (treat as null; default) | error (fail with file:line) | default (= null, backward-compatible)
jsonl.missing.field = default
## JSONL load-error policy (prompt 48): fail (abort with file:line diagnostics; default) | skip_row (log file:line + reason as WARNING, skip the row, continue, final WARNING with the skipped count)
jsonl.load.error.mode = fail
## JSONL write-mode policy (prompt 49): rewrite (full atomic rewrite on every save; default) | append (new rows appended, deltas in .jsonl.delta sidecar)
jsonl.write.mode = rewrite
## JSONL compaction threshold (prompt 49): ratio of (deletions + new rows) / total that triggers automatic compaction (default: 0.3 = 30%)
jsonl.compaction.threshold = 0.3
